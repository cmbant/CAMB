name: Closed gate reference comparison
on:
  push:
    branches: [test-refined-hyperspherical-audit]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Build four variants and compare
        env:
          OMP_NUM_THREADS: "1"
        run: |
          cat > "$RUNNER_TEMP/compare.py" <<'PY'
          import os, time
          from pathlib import Path
          import numpy as np
          import camb
          print("IMPORT", camb.__file__, flush=True)
          p = camb.CAMBparams()
          p.set_cosmology(H0=67.5, ombh2=0.022, omch2=0.122, omk=-0.05, tau=0.06)
          p.InitPower.set_params(As=2.1e-9, ns=0.965)
          p.set_for_lmax(1200, lens_potential_accuracy=1)
          p.WantTransfer = True
          for boost in (1, 2, 4):
              p.Accuracy.NonFlatIntAccuracyBoost = boost
              assert p.Accuracy.NonFlatIntAccuracyBoost == boost
              start=time.perf_counter()
              r=camb.get_results(p)
              elapsed=time.perf_counter()-start
              spectra=r.get_cmb_power_spectra(lmax=1200, CMB_unit="muK")
              tr=r.get_cmb_transfer_data()
              np.savez_compressed(Path(os.environ["RUNNER_TEMP"])/f'{os.environ["VARIANT"]}-{boost}.npz', total=spectra["total"], unlensed=spectra["unlensed_scalar"], lens=r.get_lens_potential_cls(lmax=1200), delta=tr.delta_p_l_k,L=tr.L,q=tr.q)
              print("RUNTIME",os.environ["VARIANT"],boost,elapsed,flush=True)
          PY
          for spec in baseline:3d524fece061bd88e3b2786312bfe99391826fc6 safe:a3b2d13d01a86fd2effb21734efb5e1c3c0a4873 gate:6eb9672d6f1a2b17f97cb8b773c0466a1321029c rec:6eb9672d6f1a2b17f97cb8b773c0466a1321029c; do
            name=${spec%%:*}
            sha=${spec#*:}
            git worktree add --detach "$RUNNER_TEMP/$name" "$sha"
            (
              cd "$RUNNER_TEMP/$name"
              git submodule update --init --recursive
              if [ "$name" = rec ]; then
                python - <<'PY'
          from pathlib import Path
          p=Path("fortran/hyperspherical_bessels_olver.f90")
          s=p.read_text()
          old="    sin_k = curved_radius(K, achi)\n    val = olver_reduced"
          new="""    sin_k = curved_radius(K, achi)
              if (K == 1 .and. nu-real(l,dl) <= 112._dl) then
                  val = symm*phi_recurs(l,K,nu,achi)
                  if (reduced) val = val*sin_k
                  return
              end if
              val = olver_reduced"""
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
              fi
              python -m pip install -e .
              VARIANT="$name" PYTHONPATH="$PWD" python "$RUNNER_TEMP/compare.py"
            )
          done
          python - <<'PY'
          import os
          from pathlib import Path
          import numpy as np
          t=Path(os.environ["RUNNER_TEMP"])
          for boost in (1,2,4):
              ref=np.load(t/f"rec-{boost}.npz")
              for v in ("baseline","safe","gate"):
                  a=np.load(t/f"{v}-{boost}.npz")
                  for k in ("total","unlensed","lens","delta"):
                      x=ref[k]; y=a[k]
                      if x.shape!=y.shape or (k=="delta" and (not np.array_equal(ref["L"],a["L"]) or not np.array_equal(ref["q"],a["q"]))):
                          print("GRID_MISMATCH",v,boost,k); continue
                      axes=(1,2) if k=="delta" else (0,)
                      scale=np.maximum(np.max(np.abs(x),axis=axes,keepdims=True),1e-300)
                      err=np.abs(x-y)/scale
                      idx=np.unravel_index(np.argmax(err),err.shape)
                      print("REFERENCE_ERROR",v,boost,k,np.max(err,axis=axes).tolist(),"worst",idx,"ref",float(x[idx]),"candidate",float(y[idx]))
                      if k=="delta":
                          i,j,n=idx
                          print("WORST_MODE",v,boost,"source",i,"l",int(ref["L"][j]),"q",float(ref["q"][n]))
              if boost!=4:
                  a=np.load(t/f"rec-{boost}.npz"); b=np.load(t/"rec-4.npz")
                  for k in ("total","lens","delta"):
                      x=b[k]; y=a[k]
                      if x.shape!=y.shape or (k=="delta" and (not np.array_equal(b["L"],a["L"]) or not np.array_equal(b["q"],a["q"]))): continue
                      axes=(1,2) if k=="delta" else (0,)
                      scale=np.maximum(np.max(np.abs(x),axis=axes,keepdims=True),1e-300)
                      print("REF_CONVERGENCE",boost,k,np.max(np.abs(x-y)/scale,axis=axes).tolist())
          PY
